# Source of truth for the bounded integer frontend-ast-v1 lowering policy.

[bounded_integer_program]
declaration_count = 1
variable_count = 1
instruction_count = 2
first_opcode = "add"
last_opcode = "return"
result_kind = "integer"
result_type = "i32"
source_rule = "frontend-ast-v1/program"
initializer_minimum = -100
initializer_maximum = 2047
addend_minimum = 1
addend_maximum = 10
